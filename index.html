<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>മൽഹാർ ഒറ്റച്ചോദ്യം</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; 
            /* മനോഹരമായ ഗ്രേഡിയന്റ് ബാക്ക്ഗ്രൗണ്ട് */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 40px 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); 
            width: 100%;
            max-width: 450px;
            position: relative;
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        /* മുകളിൽ ഒരു മനോഹരമായ വർണ്ണ വര */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(to right, #ff7e5f, #feb47b);
        }

        h2 { 
            text-align: center; 
            color: #333; 
            font-size: 28px;
            margin-bottom: 25px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 700; 
            color: #555; 
            font-size: 15px;
        }

        input { 
            width: 100%; 
            padding: 14px 15px; 
            border: 2px solid #e0e0e0; 
            border-radius: 8px; 
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s ease;
            background-color: #fafafa;
        }

        input:focus {
            border-color: #667eea;
            background-color: #fff;
            outline: none;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.3);
        }

        /* ഉത്തരം തെറ്റാകുമ്പോൾ ഇൻപുട്ട് ബോക്സ് ചുവപ്പാകാൻ */
        input.error-input {
            border-color: #f8d7da;
            background-color: #fff5f5;
            animation: shake 0.4s;
        }

        button { 
            width: 100%; 
            padding: 15px; 
            background: linear-gradient(to right, #11998e, #38ef7d);
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 18px;
            font-family: inherit;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(56, 239, 125, 0.3);
            margin-top: 10px;
        }

        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(56, 239, 125, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #message { 
            margin-top: 20px; 
            padding: 15px; 
            border-radius: 8px; 
            display: none; 
            text-align: center; 
            font-weight: bold; 
            font-size: 16px;
            animation: fadeIn 0.5s ease-in-out;
        }

        .success { 
            background: #d4edda; 
            color: #155724; 
            border-left: 5px solid #28a745;
        }

        .error { 
            background: #f8d7da; 
            color: #721c24; 
            border-left: 5px solid #dc3545;
        }

        /* ആനിമേഷനുകൾ */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }

        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

        input, button {
            -webkit-appearance: none;
            appearance: none;
            touch-action: manipulation;
        }

        input {
            min-height: 48px;
            line-height: 1.5;
            color: #222;
            -webkit-user-select: text;
            user-select: text;
        }

        button { min-height: 48px; }

        @media (max-width: 600px) {
            body {
                min-height: 100vh;
                min-height: 100svh;
                padding: 12px;
                align-items: flex-start;
            }
            .container {
                max-width: 100%;
                padding: 28px 20px;
                margin: 12px 0;
                border-radius: 12px;
            }
            h2 { font-size: clamp(22px, 6vw, 28px); margin-bottom: 22px; }
            .form-group { margin-bottom: 18px; }
            label { font-size: 16px; }
            input { font-size: 16px; padding: 13px 12px; }
            button { font-size: 17px; padding: 14px; }
            #message { font-size: 16px; overflow-wrap: anywhere; }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            body { align-items: flex-start; }
            .container { margin-top: 8px; margin-bottom: 8px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <h2>മൽഹാർ ഒറ്റച്ചോദ്യം</h2>
        <form id="quizForm">
            <div class="form-group">
                <label>ഉത്തരം സമർപ്പിക്കുന്ന ആളിന്റെ പേര്:</label>
                <input type="text" id="nameInput" name="authorName"
                       placeholder="നിങ്ങളുടെ പേര് നൽകുക" required
                       lang="ml" inputmode="text" autocomplete="name"
                       autocapitalize="off" spellcheck="false">
            </div>

            <div class="form-group">
                <label>ഉത്തരം:</label>
                <input type="text" id="answerInput" name="answer"
                       placeholder="ഉത്തരം ഇവിടെ നൽകുക" required
                       lang="ml" inputmode="text" enterkeyhint="done"
                       autocapitalize="off" spellcheck="false">
            </div>

            <button type="submit" id="submitBtn">സമർപ്പിക്കുക (Submit)</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        // ഇവിടെ നിങ്ങളുടെ ശരിയായ ഉത്തരങ്ങൾ നൽകുക (എത്ര വേണമെങ്കിലും ചേർക്കാം)
        const CORRECT_ANSWERS = [
            "സിനി എ.കെ",
            "സിനി. എ.കെ",
            "സിനി ഏ.കെ",
            "Sini A.K",
            "സിനി",
             "സിനി.",
              "Sini",
              "sini",
              "sini a.k",
              "sini ak",
              "sini a k",
              "Sini a.k",
              "Siny",           
        ]; 

        document.getElementById('quizForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const answerInput = document.getElementById('answerInput');
            const userAnswer = answerInput.value.trim().toLowerCase();
            const messageDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');
            const formData = new FormData(this);

            // ഉത്തരം ശരിയാണോ എന്ന് പരിശോധിക്കുന്നു
            const isCorrect = CORRECT_ANSWERS.some(ans => ans.toLowerCase() === userAnswer);

            // ഡാറ്റ Google Sheet-ലേക്ക് അയക്കാനുള്ള ഫങ്ക്ഷൻ
            const sendDataToSheet = async () => {
                submitBtn.disabled = true;
                submitBtn.textContent = "അയക്കുന്നു...";
                try {
                    await fetch('https://script.google.com/macros/s/AKfycbw25I2awh-nXA5KYOqwMkPS9tPNcy2eLXhIj2oXW1LPbfip1QYIdHpQoDaQLv8uci7tAw/exec', {
                        method: 'POST',
                        body: formData,
                        mode: 'no-cors' 
                    });
                } catch (error) {
                    console.error("Error:", error);
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = "സമർപ്പിക്കുക (Submit)";
                }
            };

            if (isCorrect) {
                // ശരിയായ ഉത്തരം
                answerInput.classList.remove('error-input');
                messageDiv.textContent = "അഭിനന്ദനങ്ങൾ! ഉത്തരം ശരിയാണ്.";
                messageDiv.className = "success";
                messageDiv.style.display = "block";
                
                await sendDataToSheet();
                
                // ശരിയായ ഉത്തരം നൽകിയാൽ മാത്രം ഫോം പൂർണ്ണമായി റീസെറ്റ് ചെയ്യുന്നു
                document.getElementById('quizForm').reset();

            } else {
                // തെറ്റായ ഉത്തരം
                messageDiv.textContent = "ക്ഷമിക്കണം, വീണ്ടും ശ്രമിക്കൂ..";
                messageDiv.className = "error";
                messageDiv.style.display = "block";
                
                // ഉത്തരം തെറ്റാണെന്ന് കാണിക്കാൻ ഇൻപുട്ട് ബോക്സിന് ചുവപ്പ് നിറം നൽകുന്നു
                answerInput.classList.add('error-input');
                
                // തെറ്റായ ഉത്തരവും ഷീറ്റിലേക്ക് അയക്കുന്നു
                await sendDataToSheet();

                // ഉത്തരം മാത്രം കാലിയാക്കി കർസർ അങ്ങോട്ട് നീക്കുന്നു 
                // (nameInput കാലിയാക്കുന്നില്ല, അതിനാൽ പേര് അതേപടി നിൽക്കും)
                answerInput.value = '';
                answerInput.focus();
            }
        });

        // ടൈപ്പ് ചെയ്യുമ്പോൾ ചുവപ്പ് നിറം മാറാൻ
        document.getElementById('answerInput').addEventListener('input', function() {
            this.classList.remove('error-input');
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>മൽഹാർ ഒറ്റച്ചോദ്യം</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 40px 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); 
            width: 100%;
            max-width: 450px;
            position: relative;
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(to right, #ff7e5f, #feb47b);
        }

        h2 { 
            text-align: center; 
            color: #333; 
            font-size: 28px;
            margin-bottom: 25px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 700; 
            color: #555; 
            font-size: 15px;
        }

        input { 
            width: 100%; 
            padding: 14px 15px; 
            border: 2px solid #e0e0e0; 
            border-radius: 8px; 
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s ease;
            background-color: #fafafa;
        }

        input:focus {
            border-color: #667eea;
            background-color: #fff;
            outline: none;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.3);
        }

        input.error-input {
            border-color: #f8d7da;
            background-color: #fff5f5;
            animation: shake 0.4s;
        }

        /* Suggestion Box Styles */
        .suggestions-box {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #e0e0e0;
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 150px;
            overflow-y: auto;
            z-index: 10;
            display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .suggestion-item {
            padding: 10px 15px;
            cursor: pointer;
            font-size: 15px;
            color: #333;
            border-bottom: 1px solid #f0f0f0;
        }

        .suggestion-item:hover {
            background-color: #f0f4ff;
            color: #667eea;
        }

        button { 
            width: 100%; 
            padding: 15px; 
            background: linear-gradient(to right, #11998e, #38ef7d);
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 18px;
            font-family: inherit;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(56, 239, 125, 0.3);
            margin-top: 10px;
        }

        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(56, 239, 125, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #message { 
            margin-top: 20px; 
            padding: 15px; 
            border-radius: 8px; 
            display: none; 
            text-align: center; 
            font-weight: bold; 
            font-size: 16px;
            animation: fadeIn 0.5s ease-in-out;
        }

        .success { 
            background: #d4edda; 
            color: #155724; 
            border-left: 5px solid #28a745;
        }

        .error { 
            background: #f8d7da; 
            color: #721c24; 
            border-left: 5px solid #dc3545;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }

        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

        input, button {
            -webkit-appearance: none;
            appearance: none;
            touch-action: manipulation;
        }

        input {
            min-height: 48px;
            line-height: 1.5;
            color: #222;
            -webkit-user-select: text;
            user-select: text;
        }

        button { min-height: 48px; }

        @media (max-width: 600px) {
            body {
                min-height: 100vh;
                min-height: 100svh;
                padding: 12px;
                align-items: flex-start;
            }
            .container {
                max-width: 100%;
                padding: 28px 20px;
                margin: 12px 0;
                border-radius: 12px;
            }
            h2 { font-size: clamp(22px, 6vw, 28px); margin-bottom: 22px; }
            .form-group { margin-bottom: 18px; }
            label { font-size: 16px; }
            input { font-size: 16px; padding: 13px 12px; }
            button { font-size: 17px; padding: 14px; }
            #message { font-size: 16px; overflow-wrap: anywhere; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>മൽഹാർ ഒറ്റച്ചോദ്യം</h2>
        <form id="quizForm">
            <div class="form-group">
                <label>ഉത്തരം സമർപ്പിക്കുന്ന ആളിന്റെ പേര്:</label>
                <input type="text" id="nameInput" name="authorName"
                       placeholder="നിങ്ങളുടെ പേര് നൽകുക" required
                       lang="ml" inputmode="text" autocomplete="name"
                       autocapitalize="off" spellcheck="false">
            </div>

            <div class="form-group">
                <label>ഉത്തരം:</label>
                <input type="text" id="answerInput" name="answer"
                       placeholder="ഉത്തരം ഇവിടെ നൽകുക" required
                       lang="ml" inputmode="text" enterkeyhint="done"
                       autocapitalize="off" spellcheck="false" autocomplete="off">
                <!-- സജഷനുകൾ കാണിക്കാനുള്ള ബോക്സ് -->
                <div id="suggestionsBox" class="suggestions-box"></div>
            </div>

            <button type="submit" id="submitBtn">സമർപ്പിക്കുക (Submit)</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        // ഇവിടെ നിങ്ങളുടെ ശരിയായ ഉത്തരങ്ങൾ നൽകുക
        const CORRECT_ANSWERS = [
            "എം.ടി.",
            "എം.ടി",
            "എം ടി",
            "എംടി",
            "എം. ടി.",
            "M.T.",
            "MT",
            "M T",
            "എം.ടി. Vasudevan Nair",‌
            "എം.ടി. വാസുദേവൻ നായർ",‌
            "എം.ടി.വാസുദേവൻ നായർ",
            "എം ടി വാസുദേവൻ നായർ",
            "എംടി വാസുദേവൻ നായർ",
            "M.T. Vasudevan Nair",
            "MT Vasudevan Nair",
            "M T Vasudevan Nair",
            "MT വാസുദേവൻ നായർ",            
            "M T വാസുദേവൻ നായർ",
            "വാസുദേവൻ നായർ",
            "വാസുദേവൻനായർ",
            "Vasudevan Nair"
        ];

        const answerInput = document.getElementById('answerInput');
        const suggestionsBox = document.getElementById('suggestionsBox');

        // പുതിയ ലോജിക് പ്രകാരം ഉത്തരം വൃത്തിയാക്കാനുള്ള ഫങ്ക്ഷൻ
        function cleanAnswer(str) {
            return str.toLowerCase()              // 1. എല്ലാം ചെറിയ അക്ഷരങ്ങളാക്കുന്നു
                      .replace(/[.,]/g, '')       // 2. എല്ലാ ഫുൾസ്റ്റോപ്പുകളും കോമകളും ഒഴിവാക്കുന്നു
                      .replace(/\s+/g, ' ')       // 3. അധിക സ്പെയ്സുകൾ ഒരു സ്പെയ്സ് ആക്കുന്നു
                      .trim();                    // 4. തുടക്കത്തിലെയും അവസാനത്തെയും സ്പെയ്സുകൾ ഒഴിവാക്കുന്നു
        }

        // സജഷനുകൾ കാണിക്കാനുള്ള ഫങ്ക്ഷൻ
        function showSuggestions(value) {
            // കുറഞ്ഞത് 5 അക്ഷരങ്ങൾ ടൈപ്പ് ചെയ്താൽ മാത്രം സജഷൻ കാണിക്കുക
            if (!value || value.length < 6) {
                suggestionsBox.style.display = 'none';
                return;
            }

            // യൂസർ നൽകിയ അക്ഷരങ്ങൾ കൊണ്ട് തുടങ്ങുന്ന (Starts with) ഉത്തരങ്ങൾ കണ്ടെത്തുന്നു
            const filtered = CORRECT_ANSWERS.filter(ans => 
                ans.toLowerCase().startsWith(value.toLowerCase())
            );

            if (filtered.length > 0) {
                suggestionsBox.innerHTML = '';
                filtered.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.textContent = item;
                    
                    // ഒരു സജഷനിൽ ക്ലിക്ക് ചെയ്യുമ്പോൾ ഇൻപുട്ട് ബോക്സിൽ അത് നിറയ്ക്കണം
                    div.addEventListener('click', function() {
                        answerInput.value = item;
                        suggestionsBox.style.display = 'none';
                        answerInput.focus();
                    });
                    suggestionsBox.appendChild(div);
                });
                suggestionsBox.style.display = 'block';
            } else {
                suggestionsBox.style.display = 'none';
            }
        }

        // ടൈപ്പ് ചെയ്യുമ്പോൾ സജഷൻ ലിസ്റ്റ് അപ്ഡേറ്റ് ചെയ്യാൻ
        answerInput.addEventListener('input', function() {
            this.classList.remove('error-input');
            showSuggestions(this.value.trim());
        });

        // പുറത്ത് എവിടെയെങ്കിലും ക്ലിക്ക് ചെയ്താൽ സജഷൻ ബോക്സ് അടയ്ക്കാൻ
        document.addEventListener('click', function(e) {
            if (e.target !== answerInput && e.target !== suggestionsBox) {
                suggestionsBox.style.display = 'none';
            }
        });

        // ഫോം സബ്മിറ്റ് ചെയ്യുമ്പോൾ
        document.getElementById('quizForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const messageDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');
            const formData = new FormData(this);

            suggestionsBox.style.display = 'none';

            // വൃത്തിയാക്കിയ ഉത്തരം എടുക്കുന്നു
            const userAnswerClean = cleanAnswer(answerInput.value);
            
            // ഉത്തരവുമായി ഒത്തുപോകുന്നുണ്ടോ എന്ന് പരിശോധിക്കുന്നു
            const isCorrect = CORRECT_ANSWERS.some(ans => cleanAnswer(ans) === userAnswerClean);

            const sendDataToSheet = async () => {
                submitBtn.disabled = true;
                submitBtn.textContent = "അയക്കുന്നു...";
                try {
                    formData.append('status', isCorrect ? 'Correct' : 'Wrong');
                    await fetch('https://script.google.com/macros/s/AKfycbyaH26qnArE8VxcAyCYrXQKeOCOYnIpIHuXZ2ejl_M34bj3j6HkPYmVvEsPKC9QLbhk/exec', {
                        method: 'POST',
                        body: formData,
                        mode: 'no-cors' 
                    });
                } catch (error) {
                    console.error("Error:", error);
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = "സമർപ്പിക്കുക (Submit)";
                }
            };

            if (isCorrect) {
                answerInput.classList.remove('error-input');
                messageDiv.textContent = "അഭിനന്ദനങ്ങൾ! ഉത്തരം ശരിയാണ്.";
                messageDiv.className = "success";
                messageDiv.style.display = "block";
                
                await sendDataToSheet();
                document.getElementById('quizForm').reset();

            } else {
                messageDiv.textContent = "ക്ഷമിക്കണം, വീണ്ടും ശ്രമിക്കൂ..";
                messageDiv.className = "error";
                messageDiv.style.display = "block";
                
                answerInput.classList.add('error-input');
                await sendDataToSheet();

                answerInput.value = '';
                answerInput.focus();
            }
        });
    </script>
</body>
</html>
